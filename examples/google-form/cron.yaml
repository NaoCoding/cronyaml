version: 1

jobs:
  google-form-new-responses:
    # CronYAML/node-cron accepts a seconds field: every 10 seconds.
    schedule: "*/10 * * * * *"
    command: "node get-new-responses.js"
    # regex_filter: only matching first-question answers reach the follow-up job.
    args: [".*@example\\.com$"]
    checkpoint:
      initialize:
        lastResponseTimestamp: now
        responseIdsAtTimestamp: "[]"
      input:
        GOOGLE_FORM_SINCE: "{{ checkpoint.lastResponseTimestamp }}"
        GOOGLE_FORM_RESPONSE_IDS_AT_TIMESTAMP: "{{ checkpoint.responseIdsAtTimestamp }}"
      output:
        lastResponseTimestamp: "{{ result.json.checkpoint.lastResponseTimestamp }}"
        responseIdsAtTimestamp: "{{ result.json.checkpoint.responseIdsAtTimestamp }}"
    env:
      GOOGLE_FORM_ID: "${GOOGLE_FORM_ID}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REFRESH_TOKEN: "${GOOGLE_REFRESH_TOKEN}"
    timeout: "20s"
    concurrency:
      policy: forbid
    if_success:
      job: send-form-response-email
      for_each: "{{ result.json.items }}"
      parameters:
        GMAIL_SUBJECT: "New Google Form response"
        GMAIL_BODY: "A new Google Form response has this answer: {{ item }}"

  # This job is invoked by if_success and does not need its own schedule.
  send-form-response-email:
    enabled: false
    command: "node ../gmail/send-email.js"
    env:
      GMAIL_TO: "${GMAIL_TO}"
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET}"
      GMAIL_REFRESH_TOKEN: "${GMAIL_REFRESH_TOKEN}"
    timeout: "20s"
    concurrency:
      policy: forbid
