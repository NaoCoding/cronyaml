version: 1

jobs:
  # General example
  hello:
    schedule: "* * * * *"
    command: "echo 'Hello from CronYAML'"
  hello_remote:
    schedule: "*/5 * * * *"
    source: "https://github.com/NaoCoding/cronyaml/blob/main/examples/remote/hello.js"
    args:
      - "Hello from the GitHub example script"

  # Gmail example
  gmail-example:
    # Copy .env.example to .env and replace the Gmail values before running.
    schedule: "0 9 * * 1-5"
    source: "https://github.com/NaoCoding/cronyaml/blob/main/examples/gmail/send-email.js"
    runtime: node
    env:
      GMAIL_CLIENT_ID: "${GMAIL_CLIENT_ID}"
      GMAIL_CLIENT_SECRET: "${GMAIL_CLIENT_SECRET}"
      GMAIL_REFRESH_TOKEN: "${GMAIL_REFRESH_TOKEN}"
      GMAIL_TO: "${GMAIL_TO}"
      GMAIL_SUBJECT: "${GMAIL_SUBJECT}"
      GMAIL_BODY: "${GMAIL_BODY}"
    timeout: "30s"
    concurrency:
      policy: forbid
